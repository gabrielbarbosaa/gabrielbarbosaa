name: Generate profile images

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: generate stats.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&hide_rank=true&include_all_commits=true&count_private=true&locale=pt-br
          path: dist/stats.svg
          fail_on_error: true

      - name: generate stats-dark.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&hide_rank=true&include_all_commits=true&count_private=true&locale=pt-br&theme=github_dark&border_color=30363D
          path: dist/stats-dark.svg
          fail_on_error: true

      - name: generate top-langs.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=compact&langs_count=6&locale=pt-br
          path: dist/top-langs.svg
          fail_on_error: true

      - name: generate top-langs-dark.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=compact&langs_count=6&locale=pt-br&theme=github_dark&border_color=30363D
          path: dist/top-langs-dark.svg
          fail_on_error: true

      - name: push images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
